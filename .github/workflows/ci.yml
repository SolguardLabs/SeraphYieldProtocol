name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Solidity dependencies
        run: forge install foundry-rs/forge-std@v1.9.6 --no-git --shallow

      - name: Cache Foundry artifacts
        uses: actions/cache@v6
        with:
          path: |
            cache
            out
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'src/**/*.sol', 'test/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Run validation
        shell: bash
        run: bash ./scripts/ci.sh
