name: Release integrity

on:
  push:
    branches: [production]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare published refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main production --tags
          main=$(git rev-parse origin/main)
          production=$(git rev-parse origin/production)
          tag=$(git rev-parse 'v1.0.0^{}')
          test "$main" = "$production"
          test "$main" = "$tag"
